name: Generate voices (ElevenLabs)

# Run by hand from the Actions tab. Needs a repository secret named
# ELEVENLABS_API_KEY (Settings → Secrets and variables → Actions). Generates
# audio only for lines that don't have it yet, then commits public/voice/ to
# the branch it ran on. On main, the Pages workflow then redeploys the site.
on:
  workflow_dispatch:
    inputs:
      prune:
        description: Also delete audio for lines that no longer exist
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: generate-voices
  cancel-in-progress: false

jobs:
  voices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate missing voice lines
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: npm run voices -- ${{ inputs.prune && '--prune' || '' }}
      - name: Commit new audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add public/voice
          if git diff --cached --quiet; then
            echo "No new voice lines."
          else
            git commit -m "Generate voice lines with ElevenLabs"
            git push
          fi
